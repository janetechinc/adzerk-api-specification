schemas:

  DistanceTarget:
    type: object
    properties:
      Id:
        type: integer
        format: int32
      FlightId:
        type: integer
        format: int32
      Distance:
        type: number
        format: float
        minimum: 0.01
        maximum: 500
        nullable: true
      Latitude:
        type: number
        format: float
        minimum: -90
        maximum: 90
        nullable: true
      Longitude:
        type: number
        format: float
        minimum: -180
        maximum: 180
        nullable: true
      StreetAddress:
        type: string
        nullable: true
